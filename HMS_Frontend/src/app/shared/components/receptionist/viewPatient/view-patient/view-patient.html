<div class="page">

  <!-- PAGE HEADER -->
  <div class="page-header">
    <h1>Patient Details</h1>
  </div>

  <!-- CONTENT -->
  <div class="card" *ngIf="patient">

    <!-- BASIC INFO -->
    <div class="section">

      <h3>Basic Information</h3>

      <div class="grid">

        <div class="item">
          <span class="label">UHID</span>
          <span class="value">{{ patient?.UHID }}</span>
        </div>

        <div class="item">
          <span class="label">Full Name</span>
          <span class="value">{{ patient?.fullName }}</span>
        </div>

        <div class="item">
          <span class="label">Email</span>
          <span class="value">{{ patient?.email }}</span>
        </div>

        <div class="item">
          <span class="label">Phone</span>
          <span class="value">{{ patient?.phone }}</span>
        </div>

      </div>
    </div>

    <!-- PERSONAL INFO -->
    <div class="section">

      <h3>Personal Information</h3>

      <div class="grid">

        <div class="item">
          <span class="label">Gender</span>
          <span class="value">{{ patient?.gender }}</span>
        </div>

        <div class="item">
          <span class="label">Blood Group</span>
          <span class="value">{{ patient?.bloodGroup }}</span>
        </div>

        <div class="item full">
          <span class="label">Location</span>
          <span class="value">{{ patient?.city }}, {{ patient?.state }}</span>
        </div>

      </div>

    </div>

  </div>

</div>
