<div class="login-page">

  <div class="login-container">

    <div class="login-branding">
      <div class="branding-content">
        <div class="brand-badge">HMS Portal</div>

        <h1>Create New Password</h1>

        <p>
          Set a new secure password to access your account.
        </p>
      </div>
    </div>

    <div class="login-panel">
      <div class="login-card">

        <div class="login-header">
          <h2>Reset Password</h2>
          <p>Enter your email and new password</p>
        </div>

        <form [formGroup]="form" (ngSubmit)="submit()" class="login-form-content">

          <div class="form-group">
            <label>Email</label>
            <input type="text" formControlName="email" class="enterprise-input" />
          </div>

          <div class="form-group">
            <label>New Password</label>
            <input type="password" formControlName="password" class="enterprise-input" />
          </div>

          <div *ngIf="message" class="success-message">
            {{ message }}
          </div>

          <div *ngIf="error" class="error-message">
            {{ error }}
          </div>

          <button type="submit" class="login-button">
            Update Password
          </button>

        </form>

      </div>
    </div>

  </div>

</div>
