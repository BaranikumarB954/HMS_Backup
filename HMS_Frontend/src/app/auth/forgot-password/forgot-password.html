<div class="login-page">

  <div class="login-container">

    <!-- LEFT SAME BRANDING -->
    <div class="login-branding">
      <div class="branding-content">
        <div class="brand-badge">HMS Portal</div>

        <h1>Reset Your Password</h1>

        <p>
          Enter your registered email to receive a temporary password and reset link.
        </p>
      </div>
    </div>

    <!-- RIGHT PANEL -->
    <div class="login-panel">
      <div class="login-card">

        <div class="login-header">
          <h2>Forgot Password</h2>
          <p>We will send you reset instructions</p>
        </div>

        <form [formGroup]="form" (ngSubmit)="submit()" class="login-form-content">

          <div class="form-group">
            <label>Email</label>
            <input
              type="text"
              class="enterprise-input"
              formControlName="email"
              placeholder="Enter your registered email"
            />
          </div>

          <div *ngIf="message" class="success-message">
            {{ message }}
          </div>

          <div *ngIf="error" class="error-message">
            {{ error }}
          </div>

          <button type="submit" class="login-button">
            Send Reset Link
          </button>

        </form>

        <div class="login-footer">
          <a routerLink="/login">Back to Login</a>
        </div>

      </div>
    </div>

  </div>

</div>
