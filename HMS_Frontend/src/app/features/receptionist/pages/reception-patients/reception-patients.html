<div class="page">

  <!-- PAGE HEADER -->
  <div class="page-header">

    <h1>Patients</h1>

    <button class="primary-btn" (click)="openModal()">
      + Add Patient
    </button>

  </div>

  <!-- TABLE CARD -->
  <div class="card">

    <table>

      <thead>
        <tr>
          <th>UHID</th>
          <th>Full Name</th>
          <th>Email</th>
          <th>Phone</th>
          <th>Gender</th>
          <th>Blood Group</th>
          <th>Location</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </thead>

      <tbody *ngIf="patients.length > 0; else noData">

        <tr *ngFor="let p of patients">

          <td>{{ p.UHID }}</td>
          <td>{{ p.fullName }}</td>
          <td>{{ p.email }}</td>
          <td>{{ p.phone }}</td>
          <td>{{ p.gender }}</td>
          <td>{{ p.bloodGroup }}</td>
          <td>{{ p.city }}, {{ p.state }}</td>

          <!-- STATUS (ACTIVE / INACTIVE like your design) -->
          <td>
            <span class="status-pill" [ngClass]="p.status === 'ACTIVE' ? 'active' : 'inactive'">
              {{ p.status }}
            </span>
          </td>

          <!-- ACTIONS (TEXT BUTTONS ONLY) -->
          <td class="actions">

            <button class="action-btn view" (click)="viewPatient(p)">
              View
            </button>

            <button class="action-btn edit" (click)="editPatient(p)">
              Edit
            </button>

            <button class="action-btn danger" *ngIf="p.status === 'ACTIVE'" (click)="toggleStatus(p)">
              Deactivate
            </button>

            <button class="action-btn success" *ngIf="p.status !== 'ACTIVE'" (click)="toggleStatus(p)">
              Activate
            </button>

          </td>

        </tr>

      </tbody>

    </table>

  </div>

  <!-- EMPTY STATE -->
  <ng-template #noData>
    <tbody>
      <tr>
        <td colspan="9">
          <app-no-data
            message="No Patients Found"
            subMessage="Add a new patient to get started">
          </app-no-data>
        </td>
      </tr>
    </tbody>
  </ng-template>

</div>
