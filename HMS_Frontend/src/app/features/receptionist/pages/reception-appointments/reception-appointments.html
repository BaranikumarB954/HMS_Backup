<div class="page">

  <!-- HEADER -->
  <div class="page-header">

    <h1>Appointments</h1>

    <button class="primary-btn" (click)="openPopup()">
      + Add Appointment
    </button>

  </div>

  <!-- TABLE CARD -->
  <div class="card">

    <table>

      <thead>
        <tr>
          <th>ID</th>
          <th>Patient</th>
          <th>Department</th>
          <th>Date</th>
          <th>Time</th>
          <th>Actions</th>
        </tr>
      </thead>

      <tbody *ngIf="appointments.length > 0; else noData">

        <tr *ngFor="let a of appointments">

          <td>{{ a.appointmentId }}</td>
          <td>{{ a.patientId?.UHID || 'N/A' }}</td>
          <td>{{ a.departmentId?.deptName }}</td>
          <td>{{ a.appointmentDate | date }}</td>

          <td>
            {{ a.timeslot.start }} - {{ a.timeslot.end }}
          </td>

          <!-- ACTIONS -->
          <td class="actions">

            <button class="icon-btn danger" (click)="delete(a._id)">
                <mat-icon>delete</mat-icon>
            </button>

          </td>

        </tr>

      </tbody>

    </table>

  </div>

  <!-- EMPTY STATE -->
  <ng-template #noData>
    <tbody>
      <tr>
        <td colspan="6">
          <app-no-data
            message="No Appointments Found"
            subMessage="Add a new Appointment to get started">
          </app-no-data>
        </td>
      </tr>
    </tbody>
  </ng-template>

</div>

<!-- POPUP -->
<app-add-appointment
  *ngIf="showPopup"
  (close)="closePopup()"
  (refresh)="onAppointmentAdded()">
</app-add-appointment>
