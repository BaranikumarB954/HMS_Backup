<div class="page">

  <!-- PAGE HEADER -->
  <div class="page-header">
    <h1>Employees</h1>
  </div>

  <!-- ACTION BAR -->
  <div class="page-actions">
    <button class="btn-primary" (click)="openPopup()">
      + Add Employee
    </button>
  </div>

  <div class="card">

    <div class="table-wrapper">

      <table class="table">

        <thead>
          <tr>
            <th>Employee ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>Phone</th>
            <th>Role</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>

        <tbody>
          <tr *ngFor="let e of employees">

            <td>{{ e.employeeId }}</td>
            <td>{{ e.firstName + " " + e.lastName }}</td>
            <td>{{ e.email }}</td>
            <td>{{ e.phone }}</td>
            <td>{{ e.roleName }}</td>

            <td>
              <span 
                class="status-pill"
                [ngClass]="{
                  'active': e.status === 'ACTIVE',
                  'inactive': e.status === 'INACTIVE'
                }"
              >
                {{ e.status }}
              </span>
            </td>

            <td class="actions">

              <!-- NEW VIEW BUTTON -->
              <button class="btn-view" (click)="openPopup(e)">
                View
              </button>

              <!-- EDIT BUTTON -->
              <button class="btn-edit" (click)="openPopup(e)">
                Edit
              </button>

              <!-- ACTIVATE / DEACTIVATE -->
              <button class="btn-warning" (click)="toggle(e.userId)">
                {{ e.status === 'ACTIVE' ? 'Deactivate' : 'Activate' }}
              </button>

            </td>

          </tr>
        </tbody>

      </table>

    </div>

  </div>

</div>

<!-- POPUP -->
<app-add-employee 
  *ngIf="showPopup"
  [editData]="selectedEmployee"
  (close)="closePopup()"
  (refresh)="onEmployeeAdded()">
</app-add-employee>
