<div class="page">

  <!-- PAGE HEADER -->
  <div class="page-header">
    <h1>Dashboard</h1>
  </div>

  <!-- CONTENT CARD -->
  <div class="card">

    <!-- STAT CARDS -->
    <div class="stats-grid">

      <div class="stat-card">
        <p class="stat-label">Total Employees</p>
        <h2 class="stat-value">{{ data.totalEmployees }}</h2>
      </div>

      <div class="stat-card">
        <p class="stat-label">Total Appointments</p>
        <h2 class="stat-value">{{ data.totalAppointments }}</h2>
      </div>

      <div class="stat-card">
        <p class="stat-label">Total Approvals</p>
        <h2 class="stat-value">{{ data.totalApprovals }}</h2>
      </div>

    </div>

  </div>

</div>
