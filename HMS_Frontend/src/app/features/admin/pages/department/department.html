<div class="page">

  <!-- PAGE HEADER -->
  <div class="page-header">
    <h1>Employees</h1>
  </div>

  <!-- FILTERS -->
  <div class="filters">

    <button 
      class="filter-btn"
      [class.active]="selectedRole === 'ALL'"
      (click)="changeRole('ALL')"
    >
      All
    </button>

    <button 
      class="filter-btn"
      [class.active]="selectedRole === 'DOCTOR'"
      (click)="changeRole('DOCTOR')"
    >
      Doctor
    </button>

    <button 
      class="filter-btn"
      [class.active]="selectedRole === 'NURSE'"
      (click)="changeRole('NURSE')"
    >
      Nurse
    </button>

  </div>

  <!-- CARD -->
  <div class="card">

    <table class="table">

      <thead>
        <tr>
          <th>ID</th>
          <th>Name</th>
          <th>Role</th>
          <th>Email</th>
          <th>Status</th>
        </tr>
      </thead>

      <tbody>
        <tr *ngFor="let emp of employees">
          <td>{{ emp.employeeId }}</td>
          <td>{{ emp.name }}</td>
          <td>{{ emp.roleName }}</td>
          <td>{{ emp.email }}</td>

          <td>
            <span 
              class="status-pill"
              [ngClass]="{
                'active': emp.status === 'ACTIVE',
                'inactive': emp.status === 'INACTIVE'
              }"
            >
              {{ emp.status }}
            </span>
          </td>

        </tr>
      </tbody>

    </table>

  </div>

  <!-- PAGINATION -->
  <div class="pagination">

    <button 
      class="btn-secondary"
      (click)="prevPage()"
      [disabled]="page === 1"
    >
      Prev
    </button>

    <span class="page-info">
      {{ page }} / {{ totalPages }}
    </span>

    <button 
      class="btn-secondary"
      (click)="nextPage()"
      [disabled]="page === totalPages"
    >
      Next
    </button>

  </div>

</div>
